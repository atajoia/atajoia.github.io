<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Conectando TikTok · Atajo IA</title>
<style>
:root{--bg:#0b1220;--card:#111a2e;--text:#e6edf7;--muted:#9fb0c8;--accent:#38bdf8}
@media (prefers-color-scheme: light){:root{--bg:#f6f8fb;--card:#ffffff;--text:#1f2937;--muted:#4b5563;--accent:#0369a1}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 system-ui,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:48px 16px}
.card{background:var(--card);border-radius:14px;padding:24px;box-shadow:0 2px 16px #0002}
h1{font-size:1.3rem;margin:0 0 8px} p{margin:8px 0} .muted{color:var(--muted)} a{color:var(--accent)}
</style>
</head>
<body>
<main>
<div class="card">
<h1>Conectando TikTok con el panel de Atajo IA…</h1>
<p id="msg" class="muted">Un momento: te llevamos de vuelta al panel en este mismo equipo.</p>
<p class="muted"><small>Esta página no guarda ni envía datos a ningún servidor: solo pasa la respuesta de TikTok al panel local de Atajo IA.</small></p>
<p><small><a href="../../privacidad/">Aviso de privacidad</a></small></p>
</div>
</main>
<script>
(function () {
  var query = window.location.search;
  var params = new URLSearchParams(query);
  var msg = document.getElementById("msg");
  if (!params.get("state") || !(params.get("code") || params.get("error"))) {
    msg.textContent = "Esta página solo sirve para volver al panel de Atajo IA después de autorizar TikTok.";
    return;
  }
  // Quita el código de esta dirección (historial) antes de pasarlo al panel local.
  try { window.history.replaceState(null, "", window.location.pathname); } catch (e) {}
  window.location.replace("http://localhost:8765/oauth/tiktok/callback" + query);
})();
</script>
</body>
</html>
