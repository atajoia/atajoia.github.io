  requireFields(data, [['competidor', 'marca'], ['precio'], ['evidencia', 'fuente']]);
  const requestedUnit = text(opts.unit), groups = new Map();
  const rows = data.map(r => {
    const name = field(r, 'competidor', 'marca'), rawPrice = field(r, 'precio'), price = money(rawPrice);
    const unit = field(r, 'unidad', 'producto') || requestedUnit, evidence = field(r, 'evidencia', 'fuente');
    const valid = price !== null && price >= 0;
    const comparable = valid && unit && (!requestedUnit || norm(unit) === norm(requestedUnit));
    if (comparable) {
      const key = norm(unit); const group = groups.get(key) || {unit, values: []};
      group.values.push(price); groups.set(key, group);
    }
    const status = !valid ? 'Precio por revisar; excluido' : !unit ? 'Falta unidad; excluido de comparación' : !comparable ? 'Otra unidad; excluido' : 'Comparable según unidad declarada';
    return [name || UNKNOWN, unit || UNKNOWN, valid ? fmt(price) : UNKNOWN, evidence || UNKNOWN, status, evidence ? 'Fuente no verificada por esta app' : 'Falta evidencia'];
  });
  const notes = ['No navega ni verifica fuentes o precios actuales. Las estadísticas describen solo las filas comparables que proporcionaste; no representan al mercado.', 'Mantén misma moneda, tamaño, modalidad y fecha. La unidad indicada como opción se aplica únicamente a filas que no la incluyan.'];
  for (const {unit, values} of groups.values()) {
    values.sort((a, b) => a - b); const n = values.length;
    const median = n % 2 ? values[(n - 1) / 2] : (values[n / 2 - 1] + values[n / 2]) / 2;
    notes.push(`${unit}: n=${n}; media=${fmt(values.reduce((a, b) => a + b, 0) / n)}; mediana=${fmt(median)}; mínimo=${fmt(values[0])}; máximo=${fmt(values[n - 1])}. Moneda/unidad declaradas por ti.`);
  }
  if (!groups.size) notes.push('Sin filas comparables: completa precio y unidad para calcular estadísticas.');
  return {columns: ['Competidor', 'Unidad', 'Precio', 'Evidencia', 'Comparabilidad', 'Revisión'], rows, notes};
}
function sales(input, opts) {
  const data = table(input), catalog = table(opts.catalog || '');
  requireFields(data, [['sku'], ['cantidad'], ['precio_unitario', 'precio']]);
  requireFields(catalog, [['sku'], ['costo_unitario', 'costo']]);
  const costs = new Map(), duplicate = new Set();
  for (const r of catalog) {
    const sku = field(r, 'sku');
    if (!sku) throw new Error('El catálogo contiene un SKU vacío.');
    if (costs.has(sku)) duplicate.add(sku);
    costs.set(sku, money(field(r, 'costo_unitario', 'costo')));
  }
  const threshold = money(opts.threshold ?? 100);
  if (threshold === null || threshold < 0) throw new Error('El umbral de margen debe ser un número no negativo.');
  let totalSales = 0, knownSales = 0, knownCosts = 0, complete = 0;
  const rows = data.map(r => {
    const sku = field(r, 'sku'), qty = money(field(r, 'cantidad')), price = money(field(r, 'precio_unitario', 'precio'));
    const cost = costs.get(sku);
    const validSale = qty !== null && qty >= 0 && price !== null && price >= 0;
    const sold = validSale ? qty * price : null;
    if (sold !== null) totalSales += sold;
    let state = 'REVISAR SKU', costTotal = null, margin = null;
    if (!validSale) state = 'REVISAR CANTIDAD/PRECIO';
    else if (duplicate.has(sku)) state = 'CATÁLOGO DUPLICADO';
    else if (typeof cost === 'number' && cost >= 0) {
      costTotal = qty * cost; margin = sold - costTotal;
      state = margin < threshold ? 'REVISAR MARGEN' : 'OK';
      complete++; knownSales += sold; knownCosts += costTotal;
    }
    return [sku || UNKNOWN, qty === null ? UNKNOWN : String(qty), fmt(sold), fmt(costTotal), fmt(margin), state];
  });
  return {columns: ['SKU', 'Cantidad', 'Venta total', 'Costo total', 'Margen', 'Alerta'], rows,
    notes: [`Ventas de líneas con cantidad/precio válidos: ${fmt(totalSales)}.`, `Solo ${complete} línea(s) con costo válido y SKU único: ventas ${fmt(knownSales)}, costos ${fmt(knownCosts)}, margen ${fmt(knownSales - knownCosts)}.`, `Umbral: ${fmt(threshold)} por línea. Los costos ausentes o duplicados no se convierten en cero.`, 'No calcula utilidad neta, impuestos, descuentos ni cargos adicionales. Cantidades o precios negativos requieren revisar el movimiento y se excluyen del cálculo.']};

function deck(input, opts) {
  const lines = inputText(input).split(/\r?\n/).map(text).filter(Boolean);
  let project = text(opts.title), section = 'Notas proporcionadas';
  const content = [];
  for (const line of lines) {
    const titled = line.match(/^(?:titulo|título)\s*:\s*(.+)$/i);
    if (titled) { if (!project) project = titled[1].trim(); continue; }
    const heading = line.match(/^#{1,6}\s+(.+)$/) || line.match(/^([^:]{1,80}):\s*$/);
    if (heading) { section = heading[1].trim(); continue; }
    content.push({section, text: line.replace(/^[-*]\s+/, '')});
  }
  if (!content.length) throw new Error('Añade contenido debajo de tus encabezados; un título solo no basta.');
  const groups = Array.from({length: 14}, () => []);
  content.forEach((item, i) => groups[Math.min(13, Math.floor(i * 14 / Math.max(14, content.length)))].push(item));
  const rows = [['01', project || 'Presentación de notas', 'Guion basado en los datos que proporcionaste.', 'Portada', 'Revisar título y audiencia']];
  for (let i = 0; i < 14; i++) {
    const items = groups[i], count = String(i + 2).padStart(2, '0');
    rows.push([count, items[0]?.section || `Contenido por completar ${i + 2}`,
      items.length ? items.map(item => item.text).join('\n') : 'No se proporcionaron notas para esta lámina.',
      items.length ? 'Título y contenido; revisar distribución visual' : 'Lámina vacía para completar',
      items.length ? 'Contrastar con las notas originales' : 'No publicar como contenido terminado']);
  }
  const markdown = `# ${mdText(project || 'Presentación de notas')}\n\nGuion local de quince láminas. No es un archivo PPTX.\n\n` + rows.map(row => `## ${row[0]}. ${mdText(row[1])}\n\n${mdText(row[2])}\n\nControl: ${mdText(row[4])}.`).join('\n\n');
  return {columns: ['Lámina', 'Título', 'Contenido', 'Disposición sugerida', 'Control'], rows, markdown,
    notes: [`${content.length} bloque(s) de notas distribuidos en catorce láminas de contenido más portada.`, 'Conserva el texto y las cifras que proporcionaste; no inventa conclusiones, porcentajes, causas, fechas o responsables.', 'Si faltan notas, deja láminas marcadas para completar. Revisa legibilidad y datos antes de presentar. Puedes descargar el guion Markdown; no se crea un PPTX ni se opera un editor externo.']};
}

const toolsB=(()=>{/* Herramientas locales R08–R13. Funciones puras: sin DOM, red, modelos ni acceso a archivos. */
const norm = value => String(value ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]/g, '');
const clean = value => String(value ?? '').trim();
const md = value => clean(value).replace(/\\/g, '\\\\').replace(/([`*_[\]<>|])/g, '\\$1').replace(/\r?\n/g, ' ');

function csv(text) {
  text = String(text ?? '').replace(/^\uFEFF/, '').replace(/\r\n?/g, '\n');
  if (!text.trim()) throw new Error('Pega los datos o usa el ejemplo para comenzar.');
  const first = text.split('\n')[0];
  const sep = first.includes('\t') ? '\t' : first.includes(';') && !first.includes(',') ? ';' : ',';
  const rows = []; let row = [], cell = '', quoted = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (ch === '"') {
      if (quoted && text[i + 1] === '"') { cell += '"'; i++; }
      else if (quoted || !cell.trim()) quoted = !quoted;
      else cell += ch;
    } else if (ch === sep && !quoted) { row.push(cell.trim()); cell = ''; }
    else if (ch === '\n' && !quoted) { row.push(cell.trim()); if (row.some(Boolean)) rows.push(row); row = []; cell = ''; }
    else cell += ch;
  }
  if (quoted) throw new Error('Hay una comilla CSV sin cerrar. Revisa los campos con comas o saltos de línea.');
  row.push(cell.trim()); if (row.some(Boolean)) rows.push(row);
  if (rows.length < 2) throw new Error('El CSV necesita encabezados y al menos una fila de datos.');
  if (rows.length > 501) throw new Error('Usa hasta 500 filas por revisión para mantener el navegador ágil.');
  const headers = rows.shift().map(norm);
  if (new Set(headers).size !== headers.length || headers.some(h => !h)) throw new Error('Los encabezados deben ser distintos y no estar vacíos.');
  return { headers, rows: rows.map((values, i) => {
    if (values.length !== headers.length) throw new Error(`Fila ${i + 2}: hay ${values.length} campos; se esperaban ${headers.length}. Usa comillas si un texto contiene comas.`);
    return Object.fromEntries(headers.map((h, n) => [h, values[n]]));
  }) };
}

function requireHeaders(data, names) {
  const missing = names.filter(name => !data.headers.includes(norm(name)));
  if (missing.length) throw new Error(`Faltan encabezados: ${missing.join(', ')}.`);
}

function tableMarkdown(columns, rows) {
  return `| ${columns.map(md).join(' | ')} |\n| ${columns.map(() => '---').join(' | ')} |\n` +
    rows.map(row => `| ${row.map(md).join(' | ')} |`).join('\n');
}

function isoDay(value, label) {
  const s = clean(value);
  if (!/^\d{4}-\d{2}-\d{2}$/.test(s)) throw new Error(`${label}: usa una fecha real AAAA-MM-DD.`);
  const ms = Date.parse(`${s}T00:00:00Z`);
  if (!Number.isFinite(ms) || new Date(ms).toISOString().slice(0, 10) !== s) throw new Error(`${label}: fecha no válida.`);
  return ms / 86400000;
}

function cents(value) {
  const s = clean(value);
  if (!/^\d+(?:\.\d{1,2})?$/.test(s)) throw new Error('Monto: usa un número no negativo como 18500.00, sin moneda ni separador de miles.');
  const [whole, fraction = ''] = s.split('.');
  const n = Number(whole) * 100 + Number(fraction.padEnd(2, '0'));
  if (!Number.isSafeInteger(n)) throw new Error('El monto es demasiado grande para calcularlo con precisión.');
  return `${Math.floor(n / 100)}.${String(n % 100).padStart(2, '0')}`;
}

function proposalRecords(input) {
  const text = clean(input);
  if (!text) throw new Error('Pega los datos del cliente o utiliza el ejemplo.');
  const first = text.split(/\r?\n/)[0];
  if (/[,;\t]/.test(first) && !/^\s*cliente\s*:/i.test(first)) {
    const parsed = csv(text); requireHeaders(parsed, ['cliente', 'alcance']); return parsed.rows;
  }
  const result = {}; let current = '';
  const known = new Set(['cliente', 'alcance', 'precio', 'entrega', 'exclusiones', 'pago']);
  for (const line of text.split(/\r?\n/)) {
    const match = line.match(/^\s*([^:]{1,35}):\s*(.*)$/);
    if (match && known.has(norm(match[1]))) { current = norm(match[1]); result[current] = match[2].trim(); }
    else if (line.trim() && current) result[current] += `\n${line.trim()}`;
    else if (line.trim()) throw new Error('Usa secciones rotuladas cliente:, alcance:, precio:, entrega: y exclusiones:, o un CSV con encabezados.');
  }
  if (!result.cliente || !result.alcance) throw new Error('Completa las secciones cliente: y alcance:.');
  return [result];
}

  ],

    const nameIndex = indexOf(data.headers, ["nombre", "cliente", "nombrecliente"]);

    const groups = new Map(), changes = [];
    const prepared = data.rows.map((row, i) => {

      if (phoneIndex >= 0 && phone !== phoneOriginal) changes.push(["Fila " + (i + 1), data.headers[phoneIndex], phoneOriginal, phone]);

const R15 = {
  id: "R15",
  title: "Prepara nombres de archivos sin colisiones",
  summary: "Genera una vista previa con fechas y conceptos explícitos. Mantiene extensiones y evita reemplazar nombres existentes. Esta función no toca tus archivos.",
  inputLabel: "Archivo original | fecha del documento | concepto verificado",
  inputHint: "Una línea por archivo con encabezado original|fecha|concepto. Fecha AAAA-MM-DD; concepto puede incluir proveedor e importe. No uses la fecha de modificación como fecha del documento.",
  sample: "original|fecha|concepto\nscan_001.txt|2026-03-04|Luz-Taller_3420-00\ndoc_002.csv|2026-03-05|Red-Oficina_899-00\nnota_003.md|2026-03-05|Red-Oficina_899-00\nnota_004.md|2026-03-05|Red-Oficina_899-00\n2026-03-05_Red-Oficina_899-00.csv|2026-03-05|Red-Oficina_899-00",
  options: [],
  action: "Crear vista previa de nombres",
  run(input) {
    const data = csvTable(input);
    const originalIndex = required(data.headers, ["original", "archivo", "archivooriginal", "nombreoriginal"], "original");
    const dateIndex = required(data.headers, ["fecha", "fechadocumento"], "fecha");
    const conceptIndex = required(data.headers, ["concepto", "descripcion", "proveedor"], "concepto");
    const originals = new Map(), used = new Set();
    data.rows.forEach(row => {
      const key = equalName(row[originalIndex].trim());
      originals.set(key, (originals.get(key) || 0) + 1);
    });
    const plan = data.rows.map((row, i) => {
      const original = row[originalIndex].trim(), date = isoDate(row[dateIndex]), concept = uniqueSlug(row[conceptIndex]);
      const extension = fileExtension(original);
      let issue = "";
      if (!original || /[\\/:*?"<>|\x00-\x1f]/.test(original) || original === "." || original === ".." || /[. ]$/.test(original))
        issue = "Revisar: solo nombres de archivo válidos, sin rutas";
      else if (originals.get(equalName(original)) > 1) issue = "Revisar: nombre original repetido; no se puede mapear de forma única";
      else if (!date) issue = "Revisar: fecha de documento ausente o inválida";
      else if (!concept) issue = "Revisar: concepto ausente o sin caracteres válidos";
      return { original, extension, i, issue, base: issue ? original : date + "_" + concept };
    });
    const destinationCounts = new Map();
    plan.filter(item => !item.issue).forEach(item => {
      const key = equalName(item.base + item.extension);
      destinationCounts.set(key, (destinationCounts.get(key) || 0) + 1);
    });
    const rows = plan.map(item => {
      if (item.issue) { used.add(equalName(item.original)); return [item.original, item.original, item.issue]; }
      let name = item.base + item.extension;
      const own = equalName(item.original);
      const stays = equalName(name) === own && !used.has(own);
      if (stays) name = item.original;
      const collision = !stays && (destinationCounts.get(equalName(name)) > 1 ||
        (originals.has(equalName(name)) && equalName(name) !== own) || used.has(equalName(name)));
      if (collision) {
        const stem = item.base + "_A" + String(item.i + 1).padStart(2, "0");
        name = stem + item.extension;
        let n = 2;
        while (originals.has(equalName(name)) || used.has(equalName(name))) name = stem + "_" + n++ + item.extension;
      }
      used.add(equalName(name));
      return [item.original, name, name === item.original ? "Sin cambio" : collision ? "Listo: colisión evitada con sufijo único" : "Listo: propuesta para revisar"];
    });
    return {
      columns: ["Original", "Nuevo", "Estado"], rows,
      notes: [
        "Los nombres nuevos son una propuesta. Los originales no se renombran ni se sobrescriben.",
        "Se preservan extensiones y se comparan colisiones sin distinguir mayúsculas, como precaución para Windows.",
        "Las filas con Revisar conservan el nombre original. No inventamos fechas a partir de la modificación del archivo.",
        "Antes de aplicar o descargar una copia renombrada, compara nombre, contenido y número de archivos."
      ],
      markdown: "# Plan de nombres R15\n\n" + markdownTable(["Original", "Nuevo", "Estado"], rows) + "\n\nConservar una copia original y este mapeo para revertir. Renombrar una extensión no convierte el contenido."
    };
  }
};

function dueDateFrom(body) {
  const candidates = [...body.matchAll(/\b(\d{4}-\d{2}-\d{2})\b/g)].map(match => match[1]);
  const unique = [...new Set(candidates)];
  if (!unique.length) return { date: "Por confirmar", note: "No hay fecha absoluta explícita" };
  if (unique.length > 1) return { date: "Por confirmar", note: "Hay varias fechas; revisar versión vigente" };
  return isoDate(unique[0]) ? { date: unique[0], note: "" } : { date: "Por confirmar", note: "Fecha inválida; revisar" };
}

export function validateRenamePlan(current, files) {
  if (!files?.size) throw new Error('Selecciona los archivos o prueba el ejemplo antes de crear el ZIP.');
  const normalized = current.columns.map(value => String(value).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]/g, ''));
  const originalIndex = normalized.findIndex(value => ['original', 'archivooriginal', 'nombreoriginal'].includes(value));
  const destinationIndex = normalized.findIndex(value => ['nuevo', 'nuevonombre', 'nombrenuevo'].includes(value));
  const stateIndex = normalized.findIndex(value => value === 'estado');
  if (originalIndex < 0 || destinationIndex < 0) throw new Error('La tabla necesita las columnas Original y Nuevo para crear el ZIP.');
  if (current.rows.length !== files.size) throw new Error('La vista previa debe incluir exactamente una fila por cada archivo seleccionado.');
  const origins = new Set(), targets = new Set(), entries = [];
  for (const row of current.rows) {
    const original = String(row[originalIndex] ?? ''), destination = String(row[destinationIndex] ?? '');
    const key = original.toLowerCase(), state = stateIndex < 0 ? '' : String(row[stateIndex] ?? '').trim();
    // El prefijo define el estado. «Listo: propuesta para revisar» es positivo;
    // la palabra revisar dentro de una recomendación no convierte la fila en error.
    if (/^(?:revisar|error|pendiente|por\s+confirmar|faltan?\s+datos?)(?:\b|:)/i.test(state)) throw new Error(`Resuelve la fila de ${original} antes de descargar el ZIP.`);
    if (origins.has(key)) throw new Error(`Origen repetido en la tabla: ${original}.`); origins.add(key);
    const file = files.get(original);
    if (!file) throw new Error(`No está seleccionado el archivo ${original}. No se crean archivos vacíos ni se omite esa fila.`);
    if (!destination || safeFilename(destination) !== destination) throw new Error(`Nombre de destino no válido: ${destination || '(vacío)'}. Corrígelo antes de descargar.`);
    const originalExtension = original.match(/\.[^.]+$/)?.[0] || '', destinationExtension = destination.match(/\.[^.]+$/)?.[0] || '';
    if (originalExtension !== destinationExtension) throw new Error(`La extensión de ${original} cambió. Renombrar no convierte el formato.`);
    const target = destination.toLowerCase(); if (targets.has(target)) throw new Error(`Destino repetido: ${destination}.`); targets.add(target);
    entries.push({ name: destination, file });
  }
  return entries;
}

  const maxGroup = Math.max(0, ...[...groups.values()].map(group => group.length));
  const grid = count !== nodes.length || maxGroup > 4;
  const columns = grid ? Math.min(3, nodes.length) : Math.max(1, maxGroup);

  if (grid) nodes.forEach((node, i) => { const pos = { x: 30 + (i % columns) * 270, y: 35 + Math.floor(i / columns) * 150 }; positions.set(text(node.id), pos); height = Math.max(height, pos.y + 135); });

  svg.append(make('rect', { width: '100%', height: '100%', fill: '#f8faf6' }));
  const defs = make('defs'); const marker = make('marker', { id: 'atajo-arrow', viewBox: '0 0 10 10', refX: 9, refY: 5, markerWidth: 7, markerHeight: 7, orient: 'auto-start-reverse' });
  marker.append(make('path', { d: 'M 0 0 L 10 5 L 0 10 z', fill: '#63766c' })); defs.append(marker); svg.append(defs);
  edges.forEach(edge => {

    const x1 = a.x + 115, y1 = a.y + 90, x2 = b.x + 115, y2 = b.y;

      `M ${x1} ${y1} C ${x1} ${y1 + 30} ${x2} ${y2 - 30} ${x2} ${y2}`;

      const group = make('g'); group.append(make('rect', { x: lx - 40, y: ly - 11, width: 80, height: 21, rx: 4, fill: '#f8faf6' }),
        make('text', { x: lx, y: ly + 4, 'text-anchor': 'middle', 'font-family': 'system-ui,sans-serif', 'font-size': 12, fill: '#3c4d43' }, text(edge.label).slice(0, 15))); svg.append(group);

  }
  const run = button(spec.action || 'Generar resultado', 'primary');
  const reset = button('Limpiar datos');

  inputPanel.append(element('div', { class: 'actions' }, [sample, run, reset]), status,
    element('p', { class: 'privacy', text: 'Tus datos se procesan en esta pestaña. No se envían a un servidor, no se guardan automáticamente y no se usan APIs de pago. Al recargar se borran los datos que pegaste.' }));
  const resultPanel = element('section', { class: 'panel', 'aria-labelledby': 'result-title' });
  const counter = element('span', { class: 'subtle', 'aria-live': 'polite' });

  const resultHost = element('div');
  const copy = button('Copiar resultado'); const saveCSV = button('Descargar CSV');
  const saveMD = button('Descargar texto'); const saveHTML = button('HTML para imprimir');
  const saveSVG = button('Descargar diagrama'); const zip = button('Descargar ZIP renombrado', 'primary');
  saveSVG.hidden = spec.id !== 'R10'; zip.hidden = spec.id !== 'R15';
  const downloads = [copy, saveCSV, saveMD, saveHTML, saveSVG, zip];
  const actions = element('div', { class: 'result-actions' }, downloads);
  const offline = anchor('Descargar herramienta', `./atajo-${spec.id.toLowerCase()}.html`, 'button'); offline.setAttribute('download', `atajo-${spec.id.toLowerCase()}.html`);
  resultPanel.append(resultHost, actions, offline);
  const workspace = element('div', { class: 'workspace' }, [inputPanel, resultPanel]); shell.append(workspace);
  shell.append(element('p', { class: 'source' }, [
    'La herramienta funciona con reglas locales y resultados revisables. ', anchor('Consulta o descarga su código', github, '', true), '. No hace publicaciones ni cambia otros sistemas.'
  ])); footer(shell);
  let result = null, svg = null, stale = false, busy = false, documentView = null, quizHost = null, diagramHost = null;
  function say(message, error = false) { status.textContent = message; status.className = error ? 'notice error' : ''; }
  function fail(error) { say(error instanceof Error ? error.message : 'No se pudo completar la acción. Revisa los datos y vuelve a intentar.', true); }
  function enable() {
    downloads.forEach(item => { item.disabled = !result || stale || busy; });
    [sample, run, reset, upload].forEach(item => { item.disabled = busy; });
    input.readOnly = busy; optionInputs.forEach(control => { control.disabled = busy; });
    const batch = document.getElementById('batch-files'); if (batch) batch.disabled = busy;
    if (!svg) saveSVG.disabled = true;
    if (spec.id === 'R15' && !files.size) zip.disabled = true;
  }
  function empty() { result = null; svg = null; stale = false; documentView = null; quizHost = null; diagramHost = null; counter.textContent = '';
    resultHost.replaceChildren(element('div', { class: 'empty' }, [element('strong', { text: 'Aquí verás el resultado.' }), element('p', { text: 'Prueba el ejemplo para entenderlo o utiliza tus propios datos. Después podrás revisar y descargar.' })])); enable(); }
  function dirty() { if (result) { stale = true; enable(); say('La entrada cambió. Vuelve a generar para actualizar el resultado y las descargas.'); } }
  function fileInventory(names) {
    const first = text(spec.sample).split(/\r?\n/)[0];
    const header = first.split(/[|,;\t]/).map(value => value.trim()).slice(0, 3);
    if (header.length !== 3) return csvText(['original', 'fecha', 'concepto'], names.map(name => [name, '', '']));
    return csvText(header, names.map(name => [name, '', '']));
  }
  function selectFiles(selected) {
    if (!selected.length || selected.length > 100) throw new Error('Selecciona de 1 a 100 archivos para el lote.');
    if (selected.reduce((total, file) => total + file.size, 0) > 25 * 1024 * 1024) throw new Error('El lote supera 25 MB. Selecciona menos archivos.');
    const selectedNames = new Set(); const next = new Map();
    for (const file of selected) { const key = file.name.toLowerCase();
      if (selectedNames.has(key)) throw new Error(`Hay nombres de origen repetidos: ${file.name}. Usa un lote con nombres únicos.`);
      selectedNames.add(key); next.set(file.name, file);
    }
    files = next; fileStatus.textContent = `${files.size} archivos solo en memoria. Los originales no se modifican.`;
  }
  function showQuiz(questions) {
    const host = element('section', { 'aria-label': 'Evaluación de práctica' });
    host.append(element('h3', { text: 'Responde y comprueba' }), element('p', { class: 'subtle', text: 'Las preguntas se construyen con reglas y con el texto que aportaste. Revisa el banco antes de usarlo para evaluar a otras personas.' }));
    const groups = [];
    questions.forEach((question, index) => {
      const section = element('fieldset', { class: 'quiz-question' });
      section.style.minWidth = '0'; section.style.border = '0';
      section.append(element('legend', { text: `${index + 1}. ${question.question}` }));
      const inputs = [];
      for (const [i, choice] of (question.choices || []).entries()) {
        const radio = element('input', { type: 'radio', name: `question-${index}`, value: i }); inputs.push(radio);
        const label = typeof choice === 'object' ? choice.label ?? choice.text ?? choice.value : choice;
        section.append(element('label', {}, [radio, text(label)]));
      }
      const feedback = element('p', { class: 'subtle', role: 'status' }); section.append(feedback); host.append(section); groups.push({ question, inputs, feedback });
    });
    const grade = button('Comprobar mis respuestas', 'primary'); const gradeStatus = element('p', { role: 'status', 'aria-live': 'polite' });
    grade.addEventListener('click', () => {
      let score = 0, answered = 0;
      for (const { question, inputs, feedback } of groups) {
        const selected = inputs.findIndex(input => input.checked), key = Number(question.answerIndex);
        if (!Number.isInteger(key) || key < 0 || key >= inputs.length) { feedback.textContent = 'Esta pregunta no tiene una clave válida; revísala antes de evaluar.'; continue; }
        const source = question.source ? ` Fuente: ${question.source}` : '';
        const answer = question.choices[key], label = typeof answer === 'object' ? answer.label ?? answer.text ?? answer.value : answer;
        if (selected < 0) feedback.textContent = `Sin responder. Respuesta de referencia: ${label}.${source}`;
        else { answered++; if (selected === key) score++; feedback.textContent = `${selected === key ? 'Correcta' : 'Revisa tu respuesta'}. Referencia: ${label}.${source}`; }
      }
      gradeStatus.textContent = `${score} aciertos de ${questions.length} preguntas. Respondiste ${answered}. Es una práctica, no una certificación.`;
    });
    host.append(element('div', { class: 'actions' }, [grade]), gradeStatus); return host;
  }
  function render() {
    resultHost.replaceChildren(); svg = null; documentView = null; quizHost = null; diagramHost = null;
    counter.textContent = `${result.rows.length} filas · ${result.columns.length} columnas`;
    if (Array.isArray(result.quiz) && result.quiz.length) { quizHost = showQuiz(result.quiz); resultHost.append(quizHost); }
    if (result.diagram) {
      try { svg = svgDiagram(result.diagram); if (svg) { diagramHost = element('div', { class: 'diagram' }, svg); diagramHost.style.maxHeight = '620px'; resultHost.append(diagramHost); } }
      catch (error) { resultHost.append(element('p', { class: 'notice', text: error.message })); }
    }
    const editHint = element('p', { class: 'subtle', text: 'Puedes corregir las celdas antes de descargar. Las ediciones afectan la tabla y sus archivos de salida.' });
    const table = element('table', { 'aria-label': 'Resultado editable' });
    const tr = element('tr'); result.columns.forEach(column => tr.append(element('th', { scope: 'col', text: column })));
    table.append(element('thead', {}, tr)); const tbody = element('tbody');
    result.rows.forEach((row, r) => {
      const line = element('tr');
      row.forEach((value, c) => {
        const cell = element('td', { contenteditable: 'plaintext-only', role: 'textbox', 'aria-label': `${result.columns[c]}, fila ${r + 1}`, spellcheck: 'false', text: value });
        cell.addEventListener('drop', event => event.preventDefault());
        cell.addEventListener('paste', event => {
          event.preventDefault(); const pasted = event.clipboardData?.getData('text/plain') || '';
          const selection = window.getSelection();
          if (selection?.rangeCount && cell.contains(selection.anchorNode)) { const range = selection.getRangeAt(0); range.deleteContents(); const node = document.createTextNode(pasted); range.insertNode(node); range.setStartAfter(node); range.collapse(true); selection.removeAllRanges(); selection.addRange(range); }
          else cell.append(document.createTextNode(pasted));
          cell.dispatchEvent(new Event('input', { bubbles: true }));
        });
        cell.addEventListener('input', () => {
          if (!result) return;
          result.rows[r][c] = cell.innerText || cell.textContent || ''; delete result.markdown;
          if (documentView) { documentView.hidden = true; documentView = null; }
          if (diagramHost) { diagramHost.remove(); diagramHost = null; svg = null; delete result.diagram; }
          if (quizHost) { quizHost.remove(); quizHost = null; delete result.quiz; }
          enable(); say('Tabla actualizada. Las descargas usarán tus cambios; vuelve a generar si necesitas reconstruir el documento, diagrama o cuestionario.');
        });
        line.append(cell);
      }); tbody.append(line);
    }); table.append(tbody);
    const scroll = element('div', { class: 'scroll', tabindex: '0', 'aria-label': 'Desliza para revisar todas las columnas' }, table);
    if (result.quiz?.length) {
      const details = element('details'); details.append(element('summary', { text: 'Ver banco y fuentes (puede incluir las respuestas)' }), editHint, scroll); resultHost.append(details);
    } else resultHost.append(editHint, scroll);
    if (result.markdown) {

    }

    enable();
  }
  function execute() {
    if (busy) return;

    } catch (error) { empty(); fail(error); }

  sample.addEventListener('click', () => {
    try {
      for (const option of spec.options || []) optionInputs.get(option.key).value = text(option.value);
      if (spec.id === 'R15') {
        const examples = JSON.parse(document.getElementById('file-examples')?.textContent || '[]');
        if (!Array.isArray(examples) || !examples.length) throw new Error('No hay archivos de ejemplo incluidos en esta página. Selecciona tus copias para probar el ZIP.');
        selectFiles(examples.map(file => { if (!file.name || typeof file.text !== 'string') throw new Error('Un archivo de ejemplo no tiene nombre o contenido válido.');

  optionInputs.forEach(control => { control.addEventListener('input', dirty); control.addEventListener('change', dirty); });

  });
  reset.addEventListener('click', () => { if (busy) return; input.value = ''; upload.value = ''; files = new Map(); const batch = document.getElementById('batch-files'); if (batch) batch.value = ''; fileStatus.textContent = ''; empty(); say('Datos y resultados borrados de esta pestaña.'); input.focus(); });

    try { const current = requireCurrent(), content = csvText(current.columns, current.rows);

        try { copied = document.execCommand('copy'); } finally { temporary.remove(); }
      }
      if (!copied) throw new Error('No se pudo copiar automáticamente. Descarga el CSV o selecciona la tabla y copia con Ctrl+C.');
      say('Resultado copiado como CSV. Puedes pegarlo en tu hoja de cálculo.');
    } catch (error) { fail(error); }
  });
  saveCSV.addEventListener('click', () => { try { const r = requireCurrent(); downloadText(csvText(r.columns, r.rows), `${spec.id}-resultado.csv`, 'text/csv;charset=utf-8'); say('CSV preparado con el resultado actual.'); } catch (error) { fail(error); } });
  saveMD.addEventListener('click', () => { try { const r = requireCurrent(); downloadText(markdownText(r, spec.title), `${spec.id}-resultado.md`, 'text/markdown;charset=utf-8'); say('Documento de texto preparado con el resultado actual.'); } catch (error) { fail(error); } });
